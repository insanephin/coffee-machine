<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>카페 도구집</h1>
    <input type="checkbox" class="switch" id="enabled" aria-label="사용">
  </header>

  <section>
    <h2>카페</h2>
    <label class="row">
      <span>게시글 페이지 안 팝업으로 열기</span>
      <input type="checkbox" class="switch" id="cafePopup">
    </label>
    <label class="row">
      <span>모바일 카페를 PC 카페로 열기</span>
      <input type="checkbox" class="switch" id="cafeMobileRedirect">
    </label>
  </section>

  <script src="popup.js"></script>
</body>
</html>
